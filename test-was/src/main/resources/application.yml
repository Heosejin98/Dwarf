server:
  port: 8080

spring:
  application:
    name: test-was

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: "*"  # 모든 actuator 엔드포인트 노출 (개발/테스트용)
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true

# 로깅 설정
logging:
  level:
    org.dwarf.testwas: INFO
    io.opentelemetry: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

# OpenAPI/Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
